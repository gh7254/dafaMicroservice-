global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8084']

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8082']

  - job_name: 'consumer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['consumer-service:8083']

  - job_name: 'produk-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['produk-service:8081']