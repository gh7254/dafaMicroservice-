global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - host.docker.internal:8761

  - job_name: 'produk'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - host.docker.internal:8086

  - job_name: 'order'
    metrics_path: '/actuator/prometheus'  

    static_configs:
      - targets:
          - host.docker.internal:8084

  - job_name: 'pelanggan'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - host.docker.internal:8082

  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - host.docker.internal:9000
  
  - job_name: 'consumer'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - host.docker.internal:8083